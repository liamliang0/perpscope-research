name: Refresh public research data
on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LLM_PROVIDER: none
      REQUEST_TIMEOUT: '15'
      REQUEST_RETRIES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect current data and preserve source timestamps
        run: python main.py
      - name: Collect historical daily series and external markets
        run: python -m src.tracking
      - name: Build current report
        run: python -m src.live_showcase
      - name: Preserve public observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/report-data.json docs/latest-snapshot.json docs/sample_report.md
          git add -f data/history/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update protocol observations and historical comparisons"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy current report
        id: deployment
        uses: actions/deploy-pages@v4
